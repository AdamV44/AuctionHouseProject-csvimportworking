<div 
  *ngIf="isVisible" 
  class="confirmation-overlay"
  (click)="onOverlayClick($event)">
  
  <div class="confirmation-dialog" (click)="$event.stopPropagation()">
    
    <div class="dialog-header">
      <h3 class="dialog-title">{{ title }}</h3>
      <button class="close-btn" (click)="onCancel()" aria-label="Zavřít">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="dialog-body">
      <p>{{ message }}</p>
    </div>

    <div class="dialog-footer">
      <button class="btn cancel-btn" (click)="onCancel()">
        {{ cancelText }}
      </button>
      <button class="btn confirm-btn" [ngClass]="confirmButtonClass" (click)="onConfirm()">
        {{ confirmText }}
      </button>
    </div>

  </div>
</div>
