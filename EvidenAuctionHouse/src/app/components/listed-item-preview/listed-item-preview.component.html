<div *ngIf="this.item && this.loaded" class="item-container" [class.has-photo]="this.hasPhoto()" style="cursor: pointer;" [routerLink]="['/items', item.id]">
    
    <!-- PHOTO SECTION (if available) - LEFT SIDE -->
    <div *ngIf="this.hasPhoto()" class="item-photo">
        <img [src]="this.getPhotoUrl()" alt="{{ item.name }}" class="photo-image">
        <p class="starting-price">Startovní cena:<br><strong>{{ this.item.startingPrice }} Kč</strong></p>
    </div>
    
    <!-- INFO & BID SECTION - RIGHT SIDE -->
    <div class="item-info">
        <p class="item-name">{{ this.stringHelper.formatString(this.item.name) }}</p>
        
        <div class="bid-info">
            <div class="max-bid">
                <span class="label">Aktuální cena</span>
                <span class="amount">{{ this.itemPrice }}</span>
                <span class="currency">Kč</span>
            </div>
            <div class="bidder-info">
                <span class="label">Poslední přihazovač</span>
                <p class="bidder-name" [class.no-bid]="!this.highestBidderName || this.highestBidderName === 'Nikdo'">
                    {{ this.getBidderInitial() || '—' }}
                </p>
            </div>
        </div>
    </div>
    
    <!-- ACTION SECTION (only without photo) -->
    <div *ngIf="!this.hasPhoto()" class="bid-action" (click)="$event.stopPropagation()">
        <app-price-input
            [auctionItemId]="this.item.id"
            [itemPrice]="this.itemPrice"
            [startingPrice]="this.item.startingPrice"
            (bidSuccess)="onBidSuccess()"
        ></app-price-input>
    </div>
    
</div>
