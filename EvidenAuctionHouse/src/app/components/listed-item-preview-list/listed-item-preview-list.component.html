<div class="grid-container" *ngIf="this.listedItems.length > 0">
  <app-listed-item-preview 
      *ngFor="let listedItem of listedItems" 
      [item]="listedItem"
      >
  </app-listed-item-preview>
</div>

<div class="empty-state" *ngIf="this.listedItems.length == 0">
  <p>Prázdná aukce</p>
</div>
