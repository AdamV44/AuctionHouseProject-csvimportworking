<div class="confirmation" role="group" aria-label="Confirmation actions">
    <button
        class="buttons confirm"
        type="button"
        (click)="onConfirm()"
        aria-label="Confirm"
    >
        ✓ Confirm
    </button>

    <button
        class="buttons cancel"
        type="button"
        (click)="onCancel()"
        aria-label="Cancel"
    >
        ✕ Cancel
    </button>
</div>
