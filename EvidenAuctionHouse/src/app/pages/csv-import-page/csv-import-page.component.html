<div class="csv-import-container" >
  <h1>CSV Import</h1>
  <div
    class="dropbox"
    (drop)="onDrop($event)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    [class.active]="isDragOver"
  >
    <span class="dropbox-text">
      Přetáhněte CSV soubor sem<br>nebo <label for="fileInput" class="file-label">vyberte soubor</label>
    </span>
    <input id="fileInput" type="file" accept=".csv" (change)="onFileSelected($event)" hidden>
  </div>
</div>
