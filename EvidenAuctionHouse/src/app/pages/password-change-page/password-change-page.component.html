<div class="password-change-container">
    <h2>Změna hesla</h2>
        <div class="form-group">
            <label for="currentPassword">Aktuální heslo</label>
            <input type="password" [(ngModel)]="this.oldPassword" required>
        </div>
        <div class="form-group">
            <label for="newPassword">Nové heslo</label>
            <input type="password" [(ngModel)]="this.newPassword" required>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Potvrďte nové heslo</label>
            <input type="password" [(ngModel)]="this.confPassword" required>
        </div>
        <button type="submit" (click)="this.onChangePassword()">Změnit heslo</button>
        <div *ngIf="this.changePasswordError" style="color: red;">Chyba: aktuální heslo nesouhlasí</div>
</div>
