<div class="page-container">
  <h1 class="page-title">Vytvořit aukci</h1>

  <div *ngIf="loaded" class="form-wrapper">
    <div class="auction-creation-container">
      <div class="form-section">
        <h2>Název aukce</h2>
        <div class="form-group">
          <input type="text" [(ngModel)]="name" placeholder="Název aukce" class="form-control">
        </div>
      </div>

      <div class="form-section">
        <h2>Termíny</h2>
        <div class="form-group">
          <input type="datetime-local" [(ngModel)]="startDateString" class="form-control">
        </div>
        <div class="form-group">
          <input type="datetime-local" [(ngModel)]="endDateString" class="form-control">
        </div>
      </div>

      <div class="form-actions">
        <button class="modern-btn" (click)="onAddItemsClick()">Přidat položky</button>
        <button class="modern-btn" (click)="promptCreateAuction()">Vytvořit aukci</button>
      </div>

      <div *ngIf="dateError" class="date-error">
        {{ dateError }}
      </div>

      <app-auction-add-items
        *ngIf="auctionItemspopupVisible"
        (itemsSelected)="onAddedItems($event)"
        [auctionId]="auctionId">
      </app-auction-add-items>

      <div class="selected-items" *ngIf="selectedItemIds && selectedItemIds.length > 0">
        <h3>Vybrané položky</h3>
        <ul>
          <li *ngFor="let id of selectedItemIds">
            <span>{{ id }}</span>
            <button (click)="removeSelectedItem(id)">&times;</button>
          </li>
        </ul>
      </div>

      <app-confirmation-dialog #confirmation (confirmed)="onConfirmation($event)"></app-confirmation-dialog>
    </div>
  </div>

  <div *ngIf="!loaded" class="loading-container">
    <div class="loading-spinner"></div>
    <p>Načítání...</p>
  </div>
</div>
