<div class="page-container">
  <h1 class="page-title">Aukce</h1>

  <div *ngIf="this.loaded">
    <app-auction-table [auctionPreviews]="auctionPreviewsOnPage"></app-auction-table>

  <button 
    aria-label="Vytvořit novou aukci"
    *ngIf="this.authService.isAdmin()" 
    class="fixed-btn create-action fab-inline" 
    [routerLink]="['/create-auction']">
    <i class="fas fa-plus"></i>
    Vytvořit aukci
  </button>
  </div>
</div>
